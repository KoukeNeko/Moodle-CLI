name: Check or update Homebrew tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable tag such as v0.1.0; empty only checks token access"
        required: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify tap access
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is required"; exit 1; }
          permission=$(gh api repos/KoukeNeko/homebrew-tap --jq '.permissions.push')
          test "$permission" = true || {
            echo "::error::HOMEBREW_TAP_TOKEN needs Contents: Read and write on KoukeNeko/homebrew-tap"
            exit 1
          }
          echo "The tap token can push to KoukeNeko/homebrew-tap."
      - name: Validate the requested release
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must look like v1.2.3"; exit 2 ;;
          esac
          case "$VERSION" in
            *-*) echo "::error::$VERSION is a pre-release"; exit 2 ;;
          esac
          test "$(gh release view "$VERSION" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$VERSION" --pattern checksums.txt --dir "$RUNNER_TEMP"
          ./scripts/render-homebrew-formula.sh \
            "$VERSION" "$RUNNER_TEMP/checksums.txt" \
            > "$RUNNER_TEMP/moodle-cli.rb"
      - name: Push the formula
        if: ${{ inputs.version != '' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/KoukeNeko/homebrew-tap.git" \
            "$tap" 2>/dev/null
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/moodle-cli.rb" "$tap/Formula/moodle-cli.rb"
          cd "$tap"
          git add Formula/moodle-cli.rb
          if git diff --cached --quiet; then
            echo "The tap already carries this formula."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "moodle-cli $VERSION"
          git push
