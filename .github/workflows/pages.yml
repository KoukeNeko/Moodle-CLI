name: Verification dashboard

on:
  push:
    branches: [main]
    paths:
      - "report-site/**"
      - "internal/wsregistry/data/**"
      - "scripts/build-report-data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: report-site/package-lock.json
      - run: npm ci
        working-directory: report-site
      - run: npm run build
        working-directory: report-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: report-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verification dashboard
        id: deployment
        uses: actions/deploy-pages@v4
