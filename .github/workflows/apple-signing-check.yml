name: Check Apple signing credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Import the Developer ID certificate without publishing artifacts
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Notarization is only half the chain: Apple can accept the key while
          # the certificate is the wrong kind, has no private key, or has a bad
          # password. A tagged release that discovers that has already consumed
          # a version number, which is not reusable.
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done

          keychain="$RUNNER_TEMP/signing-check.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$certificate"; security delete-keychain "$keychain" 2>/dev/null || true' EXIT

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$certificate"
          if ! security import "$certificate" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -x; then
            echo "::error::Importing the .p12 failed. The usual cause is a wrong MACOS_CERT_PASSWORD, or a MACOS_CERT_P12_BASE64 that is not the base64 of a .p12 export."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::The .p12 imported but holds no Developer ID Application identity. Export the certificate together with its private key."
            exit 1
          fi
          # The hash identifies the certificate and is not a secret, but there
          # is no reason to print it into a public log either.
          security find-identity -v -p codesigning "$keychain" | sed 's/[0-9A-F]\{40\}/<hash>/'
          echo 'Developer ID Application identity imported and usable by codesign.'

      - name: Validate App Store Connect key without publishing artifacts
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8_BASE64; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done

          key_file=$(mktemp "$RUNNER_TEMP/moodle-asc.XXXXXX.p8")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$key_file"
          openssl pkey -in "$key_file" -noout

          # Apple's documented read-only credential test. Do not print the
          # account's submission history or any secret to public logs.
          if ! xcrun notarytool history \
            --key "$key_file" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            > /dev/null; then
            echo '::error::Apple rejected the App Store Connect notary credentials. Check that all three secrets belong to the same active Team API Key; Individual keys cannot use notarytool.'
            exit 1
          fi
          echo 'Apple notary credentials accepted.'
