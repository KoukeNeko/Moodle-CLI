name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    # A tag must pass the repository contract before any signing secrets are
    # exposed to a release build or a public draft is created.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - run: make verify

  moodle-smoke:
    name: Moodle ${{ matrix.version }} release gate
    strategy:
      fail-fast: false
      matrix:
        version: [v45, v51, v52]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - name: Provision Moodle
        run: make moodle-up V=${{ matrix.version }}
      - name: Verify ten-year fixture
        run: ./test/e2e/decade-ci.sh ${{ matrix.version }}
      - name: Verify role-bound reads
        run: make moodle-read-matrix V=${{ matrix.version }}
      - name: Preserve redacted role-matrix evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: release-${{ matrix.version }}-roles-${{ github.run_id }}
          path: |
            test/reports/runtime-roles-${{ matrix.version }}.json
            test/reports/role-preflight-${{ matrix.version }}.jsonl
            test/reports/role-matrix-read-${{ matrix.version }}.jsonl
            test/e2e/artifacts/decade-retry-${{ matrix.version }}.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Stop Moodle
        if: always()
        run: make moodle-purge V=${{ matrix.version }}

  release:
    needs: [verify, moodle-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # GoReleaser derives the version and changelog from tags. A shallow
          # clone can produce a plausible but incorrect release.
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - uses: anchore/sbom-action/download-syft@v0.20.10
      - uses: sigstore/cosign-installer@v4.1.0

      - name: Require every Apple signing secret
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8_BASE64 MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done

      - name: Require writable package-repository tokens for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          for spec in \
            "HOMEBREW_TAP_TOKEN:KoukeNeko/homebrew-tap:$HOMEBREW_TAP_TOKEN" \
            "SCOOP_BUCKET_TOKEN:KoukeNeko/scoop-bucket:$SCOOP_BUCKET_TOKEN"; do
            IFS=: read -r name repository token <<< "$spec"
            test -n "$token" || { echo "::error::$name is required"; exit 1; }
            permission=$(GH_TOKEN="$token" gh api "repos/$repository" --jq '.permissions.push')
            test "$permission" = true || {
              echo "::error::$name needs Contents: Read and write on $repository"
              exit 1
            }
          done

      - name: Build a signed, notarized draft release
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Verify the Linux archive
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -name '*_linux_amd64.tar.gz' -print -quit)
          test -n "$archive"
          workdir=$(mktemp -d)
          tar xzf "$archive" -C "$workdir"

          test -x "$workdir/moodle"
          test -f "$workdir/README.md"
          test -f "$workdir/LICENSE"
          "$workdir/moodle" version --json | grep -q '"schema_version":1'
          "$workdir/moodle" version --json \
            | grep -q "\"version\":\"${GITHUB_REF_NAME#v}\""
          file "$workdir/moodle" | grep -q "statically linked"

      - name: Verify checksums and their workflow signature
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
          cd dist
          sha256sum --check --ignore-missing checksums.txt

  verify-macos:
    # The notarizer runs before archiving, but trust must be tested against the
    # exact downloadable archive on a real macOS host before the draft is made
    # public. Until this job passes, users cannot see a release that looks
    # signed while Gatekeeper rejects it.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the draft macOS archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*_darwin_*.tar.gz' \
            --dir "$RUNNER_TEMP/release"

      - name: Verify Developer ID and Apple notarization
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/release/*_darwin_*.tar.gz; do
            workdir=$(mktemp -d)
            tar xzf "$archive" -C "$workdir"
            test -x "$workdir/moodle"
            "$workdir/moodle" version --json \
              | grep -q "\"version\":\"${GITHUB_REF_NAME#v}\""
            codesign --verify --strict --verbose=2 "$workdir/moodle"
            codesign -dvv "$workdir/moodle" 2>&1 \
              | grep '^Authority=Developer ID Application'

            # Notarization tickets for bare binaries are resolved online and
            # can take a short time to propagate after Apple accepts them.
            accepted=false
            for attempt in 1 2 3 4 5; do
              if spctl --assess --verbose=3 --type install "$workdir/moodle"; then
                accepted=true
                break
              fi
              sleep 30
            done
            test "$accepted" = true
          done

      - name: Validate stable package manifests against draft checksums
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$RUNNER_TEMP"
          ./scripts/render-homebrew-formula.sh \
            "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/moodle-cli.rb"
          ruby -c "$RUNNER_TEMP/moodle-cli.rb"
          ./scripts/render-scoop-manifest.sh \
            "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/moodle-cli.json"
          python3 -m json.tool "$RUNNER_TEMP/moodle-cli.json" >/dev/null

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          prerelease=false
          latest=true
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=true; latest=false ;;
          esac
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" \
            -f make_latest="$latest" >/dev/null

  homebrew:
    needs: verify-macos
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render the formula from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir "$RUNNER_TEMP"
          ./scripts/render-homebrew-formula.sh \
            "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" \
            > "$RUNNER_TEMP/moodle-cli.rb"
      - name: Update KoukeNeko/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is required"; exit 1; }
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/KoukeNeko/homebrew-tap.git" \
            "$tap" 2>/dev/null
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/moodle-cli.rb" "$tap/Formula/moodle-cli.rb"
          cd "$tap"
          git add Formula/moodle-cli.rb
          if git diff --cached --quiet; then
            echo "The tap already carries this formula."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "moodle-cli $GITHUB_REF_NAME"
          git push

  scoop:
    needs: verify-macos
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render the manifest from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir "$RUNNER_TEMP"
          ./scripts/render-scoop-manifest.sh \
            "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" \
            > "$RUNNER_TEMP/moodle-cli.json"
          python3 -m json.tool "$RUNNER_TEMP/moodle-cli.json" >/dev/null
      - name: Update KoukeNeko/scoop-bucket
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BUCKET_TOKEN" || { echo "::error::SCOOP_BUCKET_TOKEN is required"; exit 1; }
          bucket="$RUNNER_TEMP/scoop-bucket"
          git clone --depth 1 \
            "https://x-access-token:$BUCKET_TOKEN@github.com/KoukeNeko/scoop-bucket.git" \
            "$bucket" 2>/dev/null
          mkdir -p "$bucket/bucket"
          cp "$RUNNER_TEMP/moodle-cli.json" "$bucket/bucket/moodle-cli.json"
          cd "$bucket"
          git add bucket/moodle-cli.json
          if git diff --cached --quiet; then
            echo "The Scoop bucket already carries this manifest."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "moodle-cli $GITHUB_REF_NAME"
          git push
