name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      # -count=1 is required: tests/arch reads package sources at runtime,
      # which are inputs the Go test cache cannot infer.
      - run: go test -count=1 -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: make lint

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go build ./cmd/moodle
      - run: go test -count=1 ./...

  contract:
    # Check the public contract from the compiled program, as a consumer does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: make build
      - name: Successful JSON uses the v1 envelope
        run: |
          ./bin/moodle version --json | tee /tmp/version.json
          grep -q '"schema_version":1' /tmp/version.json
          grep -q '"kind":"version"' /tmp/version.json
      - name: Usage failures stay machine-readable
        run: |
          set +e
          ./bin/moodle definitely-not-a-command --json > /tmp/error.json 2>/dev/null
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"kind":"error"' /tmp/error.json
          grep -q '"code":"usage"' /tmp/error.json
      - name: Human failures keep stdout clean
        run: |
          set +e
          output=$(./bin/moodle definitely-not-a-command 2>/dev/null)
          set -e
          test -z "$output"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: make build
      - run: ./scripts/generate-wiki.py --binary ./bin/moodle --check
      - run: make report-data-test

  moodle-decade:
    name: Moodle ${{ matrix.version }} decade
    strategy:
      fail-fast: false
      matrix:
        version: [v45, v51, v52]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Provision Moodle
        run: make moodle-up V=${{ matrix.version }}
      - name: Exercise ten academic years
        run: ./test/e2e/decade-ci.sh ${{ matrix.version }}
      - name: Exercise exposed read functions across runtime roles
        run: make moodle-read-matrix V=${{ matrix.version }}
      - name: Exercise representative command scenarios
        if: matrix.version == 'v52'
        run: ./test/e2e/full-run.sh --nows
      - name: Preserve redacted role-matrix evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: moodle-${{ matrix.version }}-roles-${{ github.run_id }}
          path: |
            test/reports/runtime-roles-${{ matrix.version }}.json
            test/reports/role-preflight-${{ matrix.version }}.jsonl
            test/reports/role-matrix-read-${{ matrix.version }}.jsonl
            test/e2e/artifacts/decade-retry-${{ matrix.version }}.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Capture container logs
        if: failure()
        run: |
          docker compose --project-name moodle-cli-e2e \
            --file test/e2e/docker-compose.yml \
            --profile "${{ matrix.version }}" logs --no-color > "moodle-${{ matrix.version }}.log"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: moodle-${{ matrix.version }}-logs
          path: |
            moodle-${{ matrix.version }}.log
            test/e2e/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Moodle
        if: always()
        run: make moodle-purge V=${{ matrix.version }}

  release-package:
    # Match the release toolchain; a tag should not be the first time the
    # distributable archive is opened.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - uses: anchore/sbom-action/download-syft@v0.20.10
      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the Linux archive and checksums
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -name '*_linux_amd64.tar.gz' -print -quit)
          test -n "$archive"
          workdir=$(mktemp -d)
          tar xzf "$archive" -C "$workdir"
          test -x "$workdir/moodle"
          test -f "$workdir/README.md"
          test -f "$workdir/LICENSE"
          "$workdir/moodle" version --json | grep -q '"schema_version":1'
          cd dist
          sha256sum --check --ignore-missing checksums.txt
