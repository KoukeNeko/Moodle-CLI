# 測試用 Moodle：4.5 LTS / 5.1 / 5.2，每版各一個「標準站」與一個「關閉 Mobile Web Services 站」。
#
# 用 profile 一次只起一個版本，避免 8GB 記憶體被六個容器吃爆：
#   make moodle-up V=v52     # 起容器 + 等就緒 + 佈建
#   make moodle-down V=v52
#
# 每個站台用 SQLite 單容器（輕量、免另開資料庫）。SITE_URL 必須含 port，
# 因為 Moodle 會把它寫進 $CFG->wwwroot，之後所有請求都要用同一個網址。
#
# port 一律綁 127.0.0.1：這些站有已知的固定密碼，不可以曝露到整個網段。
#
# 佈建（課程、帳號、作業、開啟 Web Services）不在這裡做，由 up.sh 在容器就緒後
# 用 docker exec 跑 seed.sh。不用 image 內建的 blueprint runner：它在 5.2 的
# public/ 佈局下會去找 /var/www/html/public/admin/cli/cfg.php 而失敗（實際在
# /var/www/html/admin/cli/cfg.php），且無法建立作業。
#
# 帳號：admin/Admin123!、teacher1/Teacher123!、student1/Student123!

x-moodle: &moodle
  image: erseco/alpine-moodle:${TAG:-v5.2.3}
  environment:
    MOODLE_DATABASE_TYPE: sqlite3
    MOODLE_USERNAME: admin
    MOODLE_PASSWORD: Admin123!
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login/index.php"]
    interval: 10s
    timeout: 5s
    retries: 40
    start_period: 30s

services:
  # ---- 測試用的 OS keychain ----
  #
  # 沒有 profile：它跟 Moodle 版本無關，而且每個版本都需要——`moodle auth login`
  # 是唯一會寫憑證的地方，headless 主機上沒有 Secret Service 就完全測不到。
  # 體積很小（約 60MB），不必跟著「一次只起一個版本」的規則。
  #
  # session bus 的 socket 開在 test/e2e/run/，主機用 DBUS_SESSION_BUS_ADDRESS
  # 連進來。金鑰圈以空密碼解鎖：拋棄式，只供測試。
  keyring:
    build: ./keyring
    image: moodle-cli-keyring:local
    # 這裡也設一次：healthcheck 是另外 exec 進去的，不會繼承 entrypoint 的環境。
    environment:
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/keyring/bus
    volumes: ["./run:/run/keyring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # 問 bus「org.freedesktop.secrets 有主嗎」，而不是只問 bus 活著沒：
      # 金鑰圈死掉時 bus 還在，只檢查 bus 會讓容器一直顯示 healthy，
      # 而 auth login 卻卡在寫不進去。
      test: ["CMD", "dbus-send", "--session", "--print-reply",
             "--dest=org.freedesktop.DBus", "/org/freedesktop/DBus",
             "org.freedesktop.DBus.GetNameOwner", "string:org.freedesktop.secrets"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ---- Moodle 4.5 LTS ----
  v45-std:
    <<: *moodle
    image: erseco/alpine-moodle:v4.5.12
    profiles: ["v45"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      # 必要：容器內 nginx 聽 8080，對外映射到別的 port。沒有這個，Moodle 會用
      # SERVER_PORT(8080) 比對 wwwroot 的 port，token.php 直接回 requirecorrectaccess。
      REVERSEPROXY: "true"
      SITE_URL: http://localhost:8451
    ports: ["127.0.0.1:8451:8080"]
    volumes: ["v45std:/var/www/moodledata"]
  v45-nows:
    <<: *moodle
    image: erseco/alpine-moodle:v4.5.12
    profiles: ["v45"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      # 必要：容器內 nginx 聽 8080，對外映射到別的 port。沒有這個，Moodle 會用
      # SERVER_PORT(8080) 比對 wwwroot 的 port，token.php 直接回 requirecorrectaccess。
      REVERSEPROXY: "true"
      SITE_URL: http://localhost:8452
    ports: ["127.0.0.1:8452:8080"]
    volumes: ["v45nows:/var/www/moodledata"]

  # ---- Moodle 5.1 ----
  v51-std:
    <<: *moodle
    image: erseco/alpine-moodle:v5.1.7
    profiles: ["v51"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      # 必要：容器內 nginx 聽 8080，對外映射到別的 port。沒有這個，Moodle 會用
      # SERVER_PORT(8080) 比對 wwwroot 的 port，token.php 直接回 requirecorrectaccess。
      REVERSEPROXY: "true"
      SITE_URL: http://localhost:8511
    ports: ["127.0.0.1:8511:8080"]
    volumes: ["v51std:/var/www/moodledata"]
  v51-nows:
    <<: *moodle
    image: erseco/alpine-moodle:v5.1.7
    profiles: ["v51"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      # 必要：容器內 nginx 聽 8080，對外映射到別的 port。沒有這個，Moodle 會用
      # SERVER_PORT(8080) 比對 wwwroot 的 port，token.php 直接回 requirecorrectaccess。
      REVERSEPROXY: "true"
      SITE_URL: http://localhost:8512
    ports: ["127.0.0.1:8512:8080"]
    volumes: ["v51nows:/var/www/moodledata"]

  # ---- Moodle 5.2 ----
  v52-std:
    <<: *moodle
    image: erseco/alpine-moodle:v5.2.3
    profiles: ["v52"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      # 必要：容器內 nginx 聽 8080，對外映射到別的 port。沒有這個，Moodle 會用
      # SERVER_PORT(8080) 比對 wwwroot 的 port，token.php 直接回 requirecorrectaccess。
      REVERSEPROXY: "true"
      SITE_URL: http://localhost:8521
    ports: ["127.0.0.1:8521:8080"]
    volumes: ["v52std:/var/www/moodledata"]
  v52-nows:
    <<: *moodle
    image: erseco/alpine-moodle:v5.2.3
    profiles: ["v52"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      # 必要：容器內 nginx 聽 8080，對外映射到別的 port。沒有這個，Moodle 會用
      # SERVER_PORT(8080) 比對 wwwroot 的 port，token.php 直接回 requirecorrectaccess。
      REVERSEPROXY: "true"
      SITE_URL: http://localhost:8522
    ports: ["127.0.0.1:8522:8080"]
    volumes: ["v52nows:/var/www/moodledata"]

  # ---- HTTPS 站（Moodle 5.2）----
  #
  # QR 登入與 autologin 需要 HTTPS：Moodle 對 http 直接回 httpsrequired，所以
  # 這兩條路在上面的站台上驗不到。憑證由 make-certs.sh 產生一個只存在於本機的 CA，
  # 測試用 SSL_CERT_FILE 去信任它——走的是真正的 TLS 驗證路徑，工具本身不需要
  # 任何「略過憑證檢查」的旗標，那種旗標一旦存在就會有人在正式環境用它。
  #
  # 只做最新的一版：這些是協定層的功能，跟 Moodle 版本無關。
  v52-tls:
    <<: *moodle
    image: erseco/alpine-moodle:v5.2.3
    container_name: moodle-tls
    profiles: ["tls"]
    environment:
      MOODLE_DATABASE_TYPE: sqlite3
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      REVERSEPROXY: "true"
      # REVERSEPROXY 只處理 host/port；scheme 要靠 sslproxy，少了它 Moodle 會
      # 以為連線是 http 而想轉址，AJAX 呼叫直接回 unsupportedredirect。
      SSLPROXY: "true"
      SITE_URL: https://localhost:8443
    volumes: ["v52tls:/var/www/moodledata"]

  # TLS 終端。Moodle 容器仍然只講 HTTP，靠 REVERSEPROXY 信任這裡的
  # X-Forwarded-Proto 才會把自己的連結產生成 https。
  tls-proxy:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    depends_on:
      v52-tls:
        condition: service_healthy
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./tls-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    restart: unless-stopped
    healthcheck:
      # 用 127.0.0.1，不是 localhost：容器裡 localhost 先解析到 ::1，而 nginx
      # 只聽 IPv4，於是 wget 拿到 Connection refused、容器永遠顯示 unhealthy。
      # 一直顯示 unhealthy 的健康檢查比沒有還糟——它教人忽略這個欄位。
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/login/index.php"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  v45std: {}
  v45nows: {}
  v51std: {}
  v51nows: {}
  v52std: {}
  v52nows: {}
  v52tls: {}
