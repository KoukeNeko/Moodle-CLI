# TLS 終端，擺在測試用 Moodle 前面。
#
# Moodle 容器仍然只講 HTTP；它用 REVERSEPROXY=true 信任這裡送出的
# X-Forwarded-Proto，才會把自己的連結產生成 https。少了那個 header，Moodle 會
# 認為請求走的是 http，wwwroot 對不上就直接回 requirecorrectaccess。
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 交作業會上傳檔案，預設的 1MB 會擋下來。
    client_max_body_size 64m;

    location / {
        proxy_pass http://moodle-tls:8080;
        # Host 刻意不轉發客戶端的值。Moodle 在 reverseproxy 模式下要求 Host 指向
        # 伺服器的內部名稱；收到與 wwwroot 相同的 Host 時，它會判定有人繞過 proxy
        # 直連而丟出 reverseproxyabused。nginx 預設就送 $proxy_host，不設即可。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  8443;
    }
}
