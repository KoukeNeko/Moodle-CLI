# Release build for moodle-cli.
#
# Two properties are load-bearing here and both come from how this tool is
# used, not from taste:
#
#   CGO_ENABLED=0 — the binary reads OS keychains and talks to a university's
#   Moodle. It has to be one static file a student can download and run, with
#   no toolchain and no shared libraries to go missing.
#
#   Reproducibility — a tool that handles credentials should be checkable
#   against its own source. goreleaser's defaults quietly break that: the
#   build date defaults to release time and mod_timestamp to compile time, so
#   two builds of one commit differ. Both are pinned to the commit's own date
#   below, and -trimpath keeps the builder's paths out of the binary.
version: 2

project_name: moodle-cli

before:
  hooks:
    - go mod tidy
    # The arch test reads other packages at run time, so Go's test cache
    # cannot see those inputs and would replay a stale pass.
    - go test -count=1 ./...

builds:
  - id: moodle
    main: ./cmd/moodle
    # The command is `moodle`; the project is moodle-cli. Users type the
    # former, so that is what the executable is called — and it does not
    # change again after the first release.
    binary: moodle
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      # The commit's date, not the build's. "Built at 14:03:51" tells nobody
      # anything and costs reproducibility.
      - -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: moodle
    ids: [moodle]
    # Stable and boring. Changing this later breaks every install script
    # anyone wrote against the first release.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  # Not a safety measure for credential handling, and it should not be sold as
  # one. It answers a different question: six months from now a dependency has
  # a CVE, and this says which released archives contained it.
  - artifacts: archive

# What this signature does and does not mean.
#
# It signs the checksum file, keylessly, through the release workflow's OIDC
# identity. That proves one thing: these bits came out of this repository's
# release job. It is worth having — it is how someone can tell a download
# apart from a lookalike.
#
# It is not what makes an operating system trust the binary. Gatekeeper wants
# Developer ID plus notarization; SmartScreen wants Authenticode and a
# publisher reputation built over releases. Neither exists here yet, so the
# release notes below say so in as many words. A project that conflates the
# two ends up believing it is signed when every user still sees a warning.
signs:
  - cmd: cosign
    # The checksum file covers every archive, so signing it signs them all.
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

release:
  draft: true
  prerelease: auto
  footer: |
    These binaries are **not code-signed or notarized**. macOS Gatekeeper and
    Windows SmartScreen will warn about them, and that warning is accurate —
    there is no publisher identity behind these files yet. Verify what you
    downloaded against `checksums.txt` before running it.

changelog:
  # The repository's CHANGELOG is written before the tag and never touched
  # after it; this only groups the commits for the release page.
  use: github
  sort: asc
  groups:
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      - '^test(\(.+\))?:'
      - '^docs(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
